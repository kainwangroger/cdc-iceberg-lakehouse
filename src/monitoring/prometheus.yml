global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "kafka"
    static_configs:
      - targets: ["kafka:9092"]

  - job_name: "connect"
    static_configs:
      - targets: ["connect:8083"]

  - job_name: "trino"
    static_configs:
      - targets: ["trino:8080"]

  - job_name: "nessie"
    static_configs:
      - targets: ["nessie:19120"]
