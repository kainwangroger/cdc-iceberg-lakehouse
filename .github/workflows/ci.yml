name: CI — CDC Iceberg Lakehouse

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Lint Python code
        run: ruff check src/ tests/ --ignore=E402,F811

      - name: Check Python syntax
        run: python -m py_compile src/spark-streaming/cdc_to_iceberg.py

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run unit tests
        run: pytest tests/test_rules.py tests/test_generator.py -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check docker-compose syntax
        run: docker compose -f docker-compose.yml config

  integration:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Start all services
        run: docker compose up -d --wait --wait-timeout 180

      - name: List containers
        run: docker compose ps

      - name: Check PostgreSQL
        run: |
          docker compose exec -T postgres-source pg_isready -U postgres

      - name: Check Kafka
        run: |
          docker compose exec -T kafka /opt/kafka/bin/kafka-cluster.sh id --bootstrap-server localhost:9092

      - name: Register Debezium connector
        run: |
          bash src/debezium/register-postgres-connector.sh

      - name: Verify connector is RUNNING
        run: |
          STATUS=$(curl -s http://localhost:8083/connectors/postgres-cdc-connector/status)
          echo "$STATUS"
          echo "$STATUS" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['connector']['state'] == 'RUNNING', f'State: {d[\"connector\"][\"state\"]}'"

      - name: Verify Kafka topics exist
        run: |
          docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list

      - name: Generate changes
        run: |
          pip install psycopg2-binary
          timeout 10 python src/scripts/generate_changes.py || true

      - name: Submit Spark job
        run: |
          docker compose exec -T spark-master bash /opt/spark-apps/submit_job.sh &
          SPARK_PID=$!
          sleep 30
          kill $SPARK_PID 2>/dev/null || true

      - name: Verify Trino can query Iceberg
        run: |
          docker compose exec -T trino trino --catalog iceberg --schema iceberg_warehouse --execute "SHOW TABLES;"

      - name: Verify data in Iceberg
        run: |
          docker compose exec -T trino trino --catalog iceberg --schema iceberg_warehouse --execute "SELECT COUNT(*) FROM customers;"

      - name: Tear down
        if: always()
        run: docker compose down -v
